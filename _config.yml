title: Hacktoberfest Hack Day Nairobi x iTech Club
description: >-
  Open-ended software and AI projects, Gemma resources, and PrimeCloud deployment for the iTech Club x MLH
  Hacktoberfest Hack Day at Zetech University — Friday 30 October 2026.
baseurl: "/hacktoberfest"
url: "https://itech-club-zetech-university.github.io"
permalink: pretty

remote_theme: "just-the-docs/just-the-docs"
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  - scope:
      path: "templates/downloads"
    values:
      layout: null
      nav_exclude: true
      search_exclude: true

color_scheme: dark

search_enabled: true
heading_anchors: true

nav_sort: case_insensitive

aux_links:
  "Event page (MLH)":
    - "https://events.mlh.com/events/14735-hacktoberfest-hack-day-nairobi-x-itech-club"
  "iTech Club":
    - "https://itechclubzetech.vercel.app/"
  "GitHub repo":
    - "https://github.com/ITech-Club-zetech-University/hacktoberfest"
aux_links_new_tab: true

footer_content: >-
  Hosted by iTech Club, Zetech University, in partnership with Major League
  Hacking (MLH). Category sponsors: DigitalOcean, Google DeepMind / Gemma, and PrimeCloud.

back_to_top: true
back_to_top_text: "Back to top"

callouts:
  important:
    title: Important
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - _internal/
  - templates/judge-score-sheet.csv
  - organizer-runbook.md
  - organizer-checklist.md
  - references/source-register.md
  - QA-REPORT.md
  - scripts/
  - tests/
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - examples/gemma/node_modules/
  - examples/gemma/.venv/
  - examples/gemma/__pycache__/
